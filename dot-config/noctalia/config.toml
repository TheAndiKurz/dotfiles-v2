[bar.default]
background_opacity = 0.5
start = ["clock", "spacer", "group:g1"]
center = [ "workspaces", "spacer_2", "active_window" ]
end = [ "tray", "notifications", "network", "bluetooth", "volume", "brightness", "battery", "control-center", "session" ]
font_family = "Ioskeley Mono"
font_weight = 400
margin_ends = 0
radius_top_left = 0
radius_top_right = 0
reserve_space = false
scale = 1.5
show_on_workspace_switch = false
smart_auto_hide = true

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "temp", "sysmon_2", "sysmon"]
    opacity = 1.0
    padding = 6.0

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-3", "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-3"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "DP-3"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-3".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "HDMI-A-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[osd]
scale = 1.25

[shell.panel]
open_near_click_control_center = true
open_near_click_launcher = true

[shell.screenshot]
copy_to_clipboard = true

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
mode = "dark"
pure_black_dark = true
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "gtk3", "gtk4", "ghostty", "helix", "hyprland", "kcolorscheme", "kitty", "qt" ]

[wallpaper]
transition = [ "disc", "fade", "honeycomb", "stripes", "wipe", "zoom" ]

    [wallpaper.default]
    path = "/home/andik/Pictures/Wallpapers/221.jpg"

    [wallpaper.last]
    path = "/home/andik/Pictures/Wallpapers/221.jpg"

    [wallpaper.monitors.DP-3]
    path = "/home/andik/Pictures/Wallpapers/221.jpg"

[widget.clock]
format = "{:%H:%M %A %d. %B}"

[widget.spacer_2]
type = "spacer"

[widget.session]
icon_color = "error"

[widget.sysmon_2]
type = "sysmon"
stat = "ram_used"

[widget.temp]
show_label = false

[widget.tray]
capsule = true

[widget.workspaces]
anchor = true
style = "focus_hint"
